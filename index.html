<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بث الأفلام التلقائي</title>
    <!-- تضمين تصميم مشغل Video.js -->
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
    <style>
        body {
            background-color: #111;
            color: #fff;
            font-family: Tahoma, sans-serif;
            text-align: center;
            padding-top: 50px;
        }
        .player-container {
            max-width: 800px;
            margin: auto;
        }
        .video-js {
            width: 100%;
            height: 450px;
            border-radius: 8px;
            overflow: hidden;
        }
    </style>
</head>
<body>

    <h2>مشغل الأفلام التلقائي (Loop)</h2>
    
    <div class="player-container">
        <video-js id="my-video" class="vjs-big-play-centered" controls preload="auto">
            <p class="vjs-no-js">يرجى تفعيل جافاسكريبت لعرض هذا الفيديو</p>
        </video-js>
    </div>

    <!-- تضمين مكتبة Video.js البرمجية -->
    <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var player = videojs('my-video');

            // رابط ملف الـ m3u8 الخام (Raw) الخاص بك على GitHub
            var m3u8Url = 'https://raw.githubusercontent.com/loolksa232-lab/my-movies-stream/main/stream.m3u8';

            player.src({
                src: m3u8Url,
                type: 'application/x-mpegURL'
            });

            // تكرار القائمة تلقائياً عند انتهاء الأفلام بالكامل
            player.on('ended', function() {
                player.src({ src: m3u8Url, type: 'application/x-mpegURL' });
                player.play();
            });
        });
    </script>

</body>
</html>
