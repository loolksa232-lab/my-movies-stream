<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Movies Stream</title>
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
    <style>
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%; background-color: #000; overflow: hidden;
        }
        .player-wrapper {
            width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center;
        }
        .video-js { width: 100% !important; height: 100% !important; }
    </style>
</head>
<body>

    <div class="player-wrapper">
        <video-js id="my-video" class="vjs-big-play-centered" controls preload="auto" playsinline>
            <p class="vjs-no-js">يرجى تفعيل جافاسكريبت لعرض هذا الفيديو</p>
        </video-js>
    </div>

    <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var player = videojs('my-video', {
                autoplay: true,
                muted: false,
                responsive: true,
                fill: true
            });

            var playlist = [];
            var currentIndex = 0;

            var m3u8Url = 'https://raw.githubusercontent.com/loolksa232-lab/my-movies-stream/main/stream.m3u8';
            var proxyUrl = 'https://corsproxy.io/?' + encodeURIComponent(m3u8Url);

            fetch(proxyUrl)
                .then(response => response.text())
                .then(data => {
                    var lines = data.split('\n');
                    for (var i = 0; i < lines.length; i++) {
                        var line = lines[i].trim();
                        if (line && !line.startsWith('#')) {
                            playlist.push(line);
                        }
                    }

                    if (playlist.length > 0) {
                        player.src({ type: 'video/mp4', src: playlist[currentIndex] });
                        player.play().catch(e => console.log("Play error:", e));
                    }
                })
                .catch(err => console.log("خطأ في جلب ملف m3u8:", err));

            player.on('ended', function() {
                if (playlist.length === 0) return;
                currentIndex++;
                if (currentIndex >= playlist.length) {
                    currentIndex = 0;
                }
                player.src({ type: 'video/mp4', src: playlist[currentIndex] });
                player.play().catch(err => console.log("Play error:", err));
            });
        });
    </script>

</body>
</html>
