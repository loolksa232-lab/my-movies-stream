<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>M3U8 Stream Player</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%; background-color: #000; overflow: hidden;
        }
        .player-container {
            width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center;
        }
        video {
            width: 100%; height: 100%; object-fit: contain;
        }
    </style>
</head>
<body>

    <div class="player-container">
        <video id="video" controls autoplay playsinline></video>
    </div>

    <script>
        var video = document.getElementById('video');
        var rawM3u8Url = 'https://raw.githubusercontent.com/loolksa232-lab/my-movies-stream/main/stream.m3u8';
        
        // جلب محتوى ملف m3u8 وتحويله محلياً لتجاوز حظر CORS نهائياً
        fetch('https://corsproxy.io/?' + encodeURIComponent(rawM3u8Url))
            .then(response => response.text())
            .then(m3u8Content => {
                // إنشاء ملف محلي وهمي (Blob) من محتوى الـ M3U8
                var blob = new Blob([m3u8Content], { type: 'application/x-mpegURL' });
                var blobUrl = URL.createObjectURL(blob);

                if (Hls.isSupported()) {
                    var hls = new Hls();
                    hls.loadSource(blobUrl);
                    hls.attachMedia(video);
                    hls.on(Hls.Events.MANIFEST_PARSED, function() {
                        video.play().catch(e => console.log("Play error:", e));
                    });
                } 
                else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                    video.src = blobUrl;
                    video.addEventListener('loadedmetadata', function() {
                        video.play().catch(e => console.log("Play error:", e));
                    });
                }
            })
            .catch(err => console.log("خطأ في قراءة ملف البث:", err));
    </script>

</body>
</html>
