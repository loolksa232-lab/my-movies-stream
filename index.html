<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Movies Stream</title>
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
    <style>
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%; background-color: #000; overflow: hidden;
        }
        .player-wrapper {
            width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center;
        }
        .video-js { width: 100% !important; height: 100% !important; }
    </style>
</head>
<body>

    <div class="player-wrapper">
        <video-js id="my-video" class="vjs-big-play-centered" controls preload="auto" playsinline>
            <p class="vjs-no-js">يرجى تفعيل جافاسكريبت لعرض هذا الفيديو</p>
        </video-js>
    </div>

    <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var player = videojs('my-video', {
                autoplay: true,
                muted: false,
                responsive: true,
                fill: true
            });

            // ضع روابط أفلامك المباشرة هنا بين العلامات (استبدل الروابط المؤقتة بروابطك)
            var playlist = [
                'https://archive.org/download/Arabic.Movies.Collection.VIU.WEB-DL.1080p/1000.Mabrook.VIU.WEB-DL.1080p.mp4',
                'https://archive.org/download/Arabic.Movies.Collection.VIU.WEB-DL.1080p/3sal.Eswed.VIU.WEB-DL.1080p.mp4'
            ];
            
            var currentIndex = 0;

            if (playlist.length > 0) {
                player.src({ type: 'video/mp4', src: playlist[currentIndex] });
            }

            // تشغيل الفيلم التالي تلقائياً وإعادة القائمة للأبد
            player.on('ended', function() {
                currentIndex++;
                if (currentIndex >= playlist.length) {
                    currentIndex = 0;
                }
                player.src({ type: 'video/mp4', src: playlist[currentIndex] });
                player.play().catch(function(err) {
                    console.log("Play error:", err);
                });
            });
        });
    </script>

</body>
</html>
