<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Video Player</title>
    <!-- تضمين تصميم مشغل Video.js -->
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
        }

        .player-wrapper {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .video-js {
            width: 100% !important;
            height: 100% !important;
        }
    </style>
</head>
<body>

    <div class="player-wrapper">
        <video-js id="my-video" class="vjs-big-play-centered" controls preload="auto" playsinline>
            <p class="vjs-no-js">يرجى تفعيل جافاسكريبت لعرض هذا الفيديو</p>
        </video-js>
    </div>

    <!-- مكتبة Video.js -->
    <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var player = videojs('my-video', {
                autoplay: true,
                muted: true, // صامت لتجاوز منع التشغيل التلقائي بالمتصفحات
                responsive: true,
                fill: true
            });

            // رابط ملف الـ m3u8 الخاص بك على GitHub ممرراً عبر بروكسي CORS لتجاوز الحظر
            var rawM3u8Url = 'https://raw.githubusercontent.com/loolksa232-lab/my-movies-stream/main/stream.m3u8';
            var proxyM3u8Url = 'https://corsproxy.io/?' + encodeURIComponent(rawM3u8Url);

            // تحميل ملف الـ M3U8 وتشغيله
            player.src({
                src: proxyM3u8Url,
                type: 'application/x-mpegURL'
            });

            player.play().catch(function(err) {
                console.log("Play error:", err);
            });

            // التكرار التلقائي للقائمة عند انتهائها
            player.on('ended', function() {
                player.src({
                    src: proxyM3u8Url,
                    type: 'application/x-mpegURL'
                });
                player.play();
            });
        });
    </script>

</body>
</html>
