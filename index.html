<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Video Player</title>
    <!-- تضمين تصميم مشغل Video.js -->
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
        }

        .player-wrapper {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .video-js {
            width: 100% !important;
            height: 100% !important;
        }
    </style>
</head>
<body>

    <div class="player-wrapper">
        <video-js id="my-video" class="vjs-big-play-centered" controls preload="auto" playsinline>
            <p class="vjs-no-js">يرجى تفعيل جافاسكريبت لعرض هذا الفيديو</p>
        </video-js>
    </div>

    <!-- مكتبة Video.js -->
    <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var player = videojs('my-video', {
                autoplay: true,
                muted: true, // صامت عند البداية لتجاوز منع المتصفحات للتشغيل التلقائي (يمكن للمشاهد رفع الصوت لاحقاً)
                responsive: true,
                fill: true
            });

            // ⚠️ ضع هنا روابط أفلام الـ MP4 المباشرة الخاصة بك بين الأقواس
            var playlist = [
                'https://archive.org/download/example_movie1/movie1.mp4',
                'https://archive.org/download/example_movie2/movie2.mp4'
            ];
            
            var currentIndex = 0;

            if (playlist.length > 0) {
                player.src({ type: 'video/mp4', src: playlist[currentIndex] });
            }

            // الانتقال للفيلم التالي تلقائياً، وعند الوصول للنهاية تعيد القائمة من البداية (تكرار للأبد)
            player.on('ended', function() {
                currentIndex++;
                if (currentIndex >= playlist.length) {
                    currentIndex = 0; // العودة للفيلم الأول
                }
                player.src({ type: 'video/mp4', src: playlist[currentIndex] });
                player.play().catch(function(err) {
                    console.log("Play error:", err);
                });
            });
        });
    </script>

</body>
</html>
