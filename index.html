<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>M3U8 Stream Player</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%; background-color: #000; overflow: hidden;
        }
        .player-container {
            width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center;
        }
        video {
            width: 100%; height: 100%; object-fit: contain;
        }
    </style>
</head>
<body>

    <div class="player-container">
        <video id="video" controls autoplay playsinline></video>
    </div>

    <script>
        var video = document.getElementById('video');
        var githubM3u8Url = 'https://raw.githubusercontent.com/loolksa232-lab/my-movies-stream/main/stream.m3u8';
        
        // استخدام خدمة AllOrigins لجلب محتوى ملف الـ M3U8 متجاوزاً حظر CORS الخاص بـ GitHub
        var proxyUrl = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(githubM3u8Url);

        fetch(proxyUrl)
            .then(function(response) {
                if (!response.ok) throw new Error('Network response was not ok');
                return response.text();
            })
            .then(function(m3u8Text) {
                // تحويل محتوى الملف النصي إلى رابط Blob محلي داخل المتصفح
                var blob = new Blob([m3u8Text], { type: 'application/vnd.apple.mpegurl' });
                var blobUrl = URL.createObjectURL(blob);

                if (Hls.isSupported()) {
                    var hls = new Hls();
                    hls.loadSource(blobUrl);
                    hls.attachMedia(video);
                    
                    hls.on(Hls.Events.MANIFEST_PARSED, function() {
                        video.play().catch(function(e) {
                            console.log("Autoplay blocked:", e);
                        });
                    });

                    hls.on(Hls.Events.ERROR, function(event, data) {
                        console.log("HLS Error:", data);
                    });
                } 
                else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                    video.src = blobUrl;
                    video.addEventListener('loadedmetadata', function() {
                        video.play().catch(function(e) {
                            console.log("Autoplay blocked:", e);
                        });
                    });
                }
            })
            .catch(function(err) {
                console.error("فشل في جلب ملف الـ M3U8:", err);
            });
    </script>

</body>
</html>
