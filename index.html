<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>M3U8 Stream Player</title>
    <!-- مكتبة HLS.js لتشغيل البث الحقيقي -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%; background-color: #000; overflow: hidden;
        }
        .player-container {
            width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center;
        }
        video {
            width: 100%; height: 100%; object-fit: contain;
        }
    </style>
</head>
<body>

    <div class="player-container">
        <video id="video" controls autoplay playsinline></video>
    </div>

    <script>
        var video = document.getElementById('video');
        
        // استخدام رابط jsDelivr المعتمد رسمياً لملفات جيت هاب والذي يدعم CORS 100% بدون حظر
        var m3u8Url = 'https://cdn.jsdelivr.net/gh/loolksa232-lab/my-movies-stream@main/stream.m3u8';

        if (Hls.isSupported()) {
            var hls = new Hls({
                maxBufferLength: 30,
                maxMaxBufferLength: 60,
                xhrSetup: function (xhr, url) {
                    // السماح بطلب الشرائح بدون قيود
                    xhr.withCredentials = false;
                }
            });

            hls.loadSource(m3u8Url);
            hls.attachMedia(video);
            
            hls.on(Hls.Events.MANIFEST_PARSED, function() {
                video.play().catch(function(e) {
                    console.log("Autoplay blocked:", e);
                });
            });

            hls.on(Hls.Events.ERROR, function(event, data) {
                console.error("HLS Error encountered:", data);
                if (data.fatal) {
                    switch(data.type) {
                        case Hls.ErrorTypes.NETWORK_ERROR:
                            hls.startLoad();
                            break;
                        case Hls.ErrorTypes.MEDIA_ERROR:
                            hls.recoverMediaError();
                            break;
                        default:
                            hls.destroy();
                            break;
                    }
                }
            });
        } 
        else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            // لدعم أجهزة أافل و Safari
            video.src = m3u8Url;
            video.addEventListener('loadedmetadata', function() {
                video.play().catch(function(e) {
                    console.log("Autoplay blocked:", e);
                });
            });
        }
    </script>

</body>
</html>
