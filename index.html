<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Video Player</title>
    <!-- تضمين تصميم مشغل Video.js -->
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
    <style>
        /* إلغاء الهوامش والجعل الصفحة بالكامل خلفية سوداء */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
        }

        /* حاوية المشغل ملء الشاشة بالكامل */
        .player-wrapper {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* ضبط مشغل Video.js ليمتد كاملاً */
        .video-js {
            width: 100% !important;
            height: 100% !important;
        }

        /* تحسين مظهر زر التشغيل المتركز بالمنتصف */
        .vjs-big-play-centered .vjs-big-play-button {
            border-radius: 50%;
            width: 80px;
            height: 80px;
            line-height: 80px;
            margin-top: -40px;
            margin-left: -40px;
            background-color: rgba(0, 0, 0, 0.7);
            border: 2px solid #fff;
        }
    </style>
</head>
<body>

    <div class="player-wrapper">
        <video-js id="my-video" class="vjs-big-play-centered" controls preload="auto" playsinline>
            <p class="vjs-no-js">يرجى تفعيل جافاسكريبت لعرض هذا الفيديو</p>
        </video-js>
    </div>

    <!-- مكتبة Video.js -->
    <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var player = videojs('my-video', {
                autoplay: false,
                responsive: true,
                fill: true
            });

            // رابط ملف m3u8 المباشر الخاص بك
            var m3u8Url = 'https://raw.githubusercontent.com/loolksa232-lab/my-movies-stream/main/stream.m3u8';

            player.src({
                src: m3u8Url,
                type: 'application/x-mpegURL'
            });

            // التكرار التلقائي للقائمة فور انتهائها
            player.on('ended', function() {
                player.src({ src: m3u8Url, type: 'application/x-mpegURL' });
                player.play();
            });
        });
    </script>

</body>
</html>
