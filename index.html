<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>M3U8 Stream Player</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%; background-color: #000; overflow: hidden;
        }
        .player-container {
            width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center;
        }
        video {
            width: 100%; height: 100%; object-fit: contain;
        }
    </style>
</head>
<body>

    <div class="player-container">
        <video id="video" controls autoplay playsinline></video>
    </div>

    <script>
        var video = document.getElementById('video');
        
        // رابط ملف الـ M3U8 مباشرة مع تجاوز CORS عبر بروكسي سريع
        var rawM3u8Url = 'https://raw.githubusercontent.com/loolksa232-lab/my-movies-stream/main/stream.m3u8';
        var m3u8Url = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(rawM3u8Url);

        if (Hls.isSupported()) {
            var hls = new Hls({
                xhrSetup: function (xhr, url) {
                    // توجيه طلبات الـ ts عبر البروكسي لتجنب حظر CORS تماماً
                    if (url.endsWith('.ts') || url.includes('.ts?')) {
                        // إذا كانت روابط الـ ts نسبية، اربطها برابط المستودع الأساسي
                        if (!url.startsWith('http')) {
                            url = 'https://raw.githubusercontent.com/loolksa232-lab/my-movies-stream/main/' + url;
                        }
                        xhr.open('GET', 'https://api.allorigins.win/raw?url=' + encodeURIComponent(url), true);
                    }
                }
            });

            hls.loadSource(m3u8Url);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, function() {
                video.play().catch(e => console.log("Play error:", e));
            });
            
            hls.on(Hls.Events.ERROR, function(event, data) {
                console.log("HLS Error:", data);
            });
        } 
        else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = rawM3u8Url;
            video.addEventListener('loadedmetadata', function() {
                video.play().catch(e => console.log("Play error:", e));
            });
        }
    </script>

</body>
</html>
