<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Stream Player</title>
    <!-- HLS.js Core Library -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html, body {
            width: 100%;
            height: 100%;
            background-color: #000000;
            overflow: hidden;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }
        .player-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            outline: none;
        }
        /* Style video controls nicely across browsers */
        video::-webkit-media-controls-enclosure {
            border-radius: 0;
        }
    </style>
</head>
<body>

    <div class="player-container">
        <video id="video" controls autoplay playsinline preload="auto"></video>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            var video = document.getElementById('video');
            var m3u8Url = 'stream.m3u8';

            if (Hls.isSupported()) {
                var hls = new Hls({
                    maxBufferLength: 60,
                    maxMaxBufferLength: 120,
                    enableWorker: true,
                    lowLatencyMode: true,
                    backBufferLength: 90
                });

                hls.loadSource(m3u8Url);
                hls.attachMedia(video);

                hls.on(Hls.Events.MANIFEST_PARSED, function() {
                    video.play().catch(function(error) {
                        console.log("Autoplay policy blocked video play:", error);
                    });
                });

                // Automatic recovery for network and media errors
                hls.on(Hls.Events.ERROR, function(event, data) {
                    if (data.fatal) {
                        switch (data.type) {
                            case Hls.ErrorTypes.NETWORK_ERROR:
                                console.log("Network error encountered, trying to recover...");
                                hls.startLoad();
                                break;
                            case Hls.ErrorTypes.MEDIA_ERROR:
                                console.log("Media error encountered, trying to recover...");
                                hls.recoverMediaError();
                                break;
                            default:
                                console.log("Fatal error, destroying HLS instance...");
                                hls.destroy();
                                break;
                        }
                    }
                });
            } 
            else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                // Native Safari / iOS HLS support
                video.src = m3u8Url;
                video.addEventListener('loadedmetadata', function() {
                    video.play().catch(function(error) {
                        console.log("Autoplay policy blocked video play:", error);
                    });
                });
            }
        });
    </script>

</body>
</html>
